# 이미 빌드된 이미지로 컨테이너를 띄우는 예시. 이미지 만들기는 Dockerfile과 README가
# 담당하고(`docker build -t my-service .`), 이 파일은 "그 이미지를 어떤 설정/볼륨/네트워크로
# 실행하는가"만 다룬다. 그대로 쓰기보다 배포 환경에 맞게 고쳐 쓰는 것을 전제로 한 가이드다.
#
# 개발 중에는 이 파일이 필요 없다 — 서버는 `cargo run`으로 도는 게 훨씬 빠르다.
#
# [설명] DB 서비스를 여기에 두지 않았다. 이 구성은 "이미 있는 Postgres에 붙는다"를
# 전제로 하며, 접속 정보는 아래에서 마운트하는 .env의 DATABASE_URL로 정한다. compose가
# DB까지 띄우게 하려면 postgres 서비스와 볼륨을 직접 추가하고, app에 depends_on을 걸면 된다.
services:
  app:
    # 로컬에서 구운 태그. 레지스트리를 쓰면 registry.example.com/my-service:0.1.0처럼
    # 호스트를 포함한 태그로 바꾸면 compose가 없을 때 pull까지 해준다.
    image: my-service:latest
    restart: unless-stopped
    ports:
      - "8080:8080"

    # [주의] 종료 신호(SIGTERM) 후 도커가 기다려 주는 시간. 기본값이 10초인데, 앱은 진행 중인
    # 요청을 마친 뒤 백그라운드 태스크를 SHUTDOWN_TIMEOUT_SECS(기본 10초)만큼 더 기다리므로
    # 합치면 10초를 넘을 수 있다. 넘으면 도커가 SIGKILL로 끊어 graceful shutdown이 무의미해진다.
    # 긴 요청이나 배치가 있는 서비스라면 살려서 "요청 타임아웃 + SHUTDOWN_TIMEOUT_SECS"보다
    # 넉넉하게 잡는다.
    #
    # stop_grace_period: 30s

    # [아키텍처] 설정은 environment로 옮겨 적지 않는다. .env 파일을 통째로 마운트하고 앱이
    # 기동할 때 직접 읽는다(bin/server.rs). .env.example에 있는 값은 전부 이 파일 하나로
    # 적용되므로, 설정이 늘어도 이 compose 파일은 그대로다.
    #
    # [예외] 앱보다 먼저 도는 entrypoint가 써야 하는 값은 .env로는 닿지 않으므로 여기서
    # 넘긴다. 지금은 DATA_DIR뿐이고, 기본값(/var/lib/app)을 쓴다면 이 블록은 필요 없다.
    # 바꾼다면 아래 volumes의 컨테이너 쪽 경로도 같이 바꿀 것.
    #
    # environment:
    #   DATA_DIR: /var/lib/app

    volumes:
      # 1. 설정 파일. 컨테이너의 작업 디렉토리(/app)에 놓이면 앱이 .env로 찾는다.
      #    읽기 전용(:ro)으로 붙인다 — 앱이 설정을 고칠 일은 없다.
      #
      #    [주의] 호스트에 ./.env가 **없으면** 도커는 그 자리에 빈 디렉토리를 만들어 붙이고,
      #    entrypoint가 그걸 알려주며 기동을 멈춘다. `cp .env.example .env`로 먼저 만들 것.
      #
      #    [설명] 호스트 .env의 권한은 신경 쓰지 않아도 된다. entrypoint가 root일 때 읽어
      #    appuser 전용 사본을 만들어 주기 때문이다(docker-entrypoint.sh).
      - ./.env:/app/.env:ro
      # 2. 서비스가 파일을 남길 위치. 컨테이너 쪽 경로는 이미지의 DATA_DIR 기본값이다.
      #
      #    [설명] 호스트 디렉토리를 미리 만들거나 chown 해둘 필요는 없다. 컨테이너가 시작할 때
      #    entrypoint가 마운트된 뒤의 소유권을 직접 맞추기 때문이다(docker-entrypoint.sh).
      #    없는 디렉토리는 도커가 만들어준다.
      #
      #    [주의] 이름 있는 볼륨(`appdata:/var/lib/app`)으로 바꿔도 그대로 동작한다. 호스트에서
      #    파일을 직접 들여다볼 일이 없다면 그쪽이 관리가 편하다.
      - ./data:/var/lib/app
